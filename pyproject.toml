[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mossjax"
version = "0.0.1"
description = "MOSS-Image LoRA fine-tuning on TPU with JAX/Flax and int8 base weights"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "safetensors>=0.4",
  "jax>=0.4.38",
]

[project.optional-dependencies]
convert = ["torch>=2.4"]
test = ["pytest>=8", "torch>=2.4", "transformers>=5.12", "diffusers>=0.42"]
train = ["flax>=0.10", "optax>=0.2", "orbax-checkpoint>=0.6"]
interactive = ["gradio>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/reference"
filterwarnings = ["ignore::DeprecationWarning"]
